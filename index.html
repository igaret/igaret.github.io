<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>igaret — Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
    --bg: #e5e5e5;
    --fg: #222;
    --accent: #0078d7;
    --tile-bg: #0078d7;
    --tile-fg: #fff;
    --header-bg: #0078d7;
    --header-fg: #fff;
    --flyout-bg: #1f1f1f;
    --flyout-fg: #fff;
    --tab-bg: #f0f0f0;
    --tab-border: #ddd;
}

[data-theme="dark"] {
    --bg: #1e1e1e;
    --fg: #ddd;
    --accent: #2899f5;
    --tile-bg: #2899f5;
    --tile-fg: #000;
    --header-bg: #111;
    --header-fg: #fff;
    --flyout-bg: #111;
    --flyout-fg: #eee;
    --tab-bg: #2a2a2a;
    --tab-border: #444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Segoe UI, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
}

/* Header */
header {
    background: var(--header-bg);
    color: var(--header-fg);
    padding: 60px 40px;
    text-align: left;
    opacity: 0;
    transform: translateY(-20px);
    animation: headerDrop 0.6s ease forwards;
}

header h1 {
    font-size: 3rem;
    margin: 0;
    font-weight: 300;
}

header p {
    font-size: 1.2rem;
    opacity: 0.9;
}

/* Header animation */
@keyframes headerDrop {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Flyout menu */
#menuButton {
    position: fixed;
    top: 20px;
    left: 20px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 4px;
    z-index: 1000;
    font-size: 0.95rem;
}

#flyout {
    position: fixed;
    top: 0;
    left: -260px;
    width: 260px;
    height: 100%;
    background: var(--flyout-bg);
    color: var(--flyout-fg);
    padding: 20px;
    transition: left 0.35s cubic-bezier(.25,.8,.25,1);
    z-index: 900;
}

#flyout.open {
    left: 0;
}

#flyout h2 {
    margin-top: 0;
    font-weight: 300;
}

#flyout a {
    display: block;
    color: #9cf;
    margin: 10px 0;
    text-decoration: none;
    font-size: 0.95rem;
}

/* Theme toggle */
#themeToggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 10px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
}

/* Repo Tabs */
#tabs {
    display: flex;
    overflow-x: auto;
    background: var(--tab-bg);
    border-bottom: 2px solid #ccc;
}

.tab {
    padding: 10px 16px;
    cursor: pointer;
    white-space: nowrap;
    border-right: 1px solid var(--tab-border);
    font-weight: 500;
    background: var(--tab-bg);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.25s ease, color 0.25s ease;
    flex-shrink: 0;
}

.tab:hover {
    background: rgba(0,0,0,0.05);
}

.tab.active {
    background: var(--accent);
    color: white;
}

/* Repo icon in tab */
.repo-icon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    flex-shrink: 0;
}

/* Content area */
#content {
    padding: 40px 20px;
    max-width: 1000px;
    margin: auto;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
}

#content.visible {
    opacity: 1;
    transform: translateY(0);
}

#content h2 {
    margin-top: 0;
}

/* Metro tiles for languages */
.tile-grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    margin-top: 20px;
}

@media (min-width: 900px) {
    .tile-grid {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
}

@media (min-width: 1300px) {
    .tile-grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
}

.tile {
    background: var(--tile-bg);
    color: var(--tile-fg);
    padding: 20px;
    border-radius: 6px;
    font-size: 1.05rem;
    text-align: center;
    font-weight: 500;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    opacity: 0;
    transform: scale(0.9);
    animation: tilePop 0.35s ease forwards;
}

/* Tile animation */
@keyframes tilePop {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Stagger tiles */
.tile:nth-child(1) { animation-delay: 0.05s; }
.tile:nth-child(2) { animation-delay: 0.10s; }
.tile:nth-child(3) { animation-delay: 0.15s; }
.tile:nth-child(4) { animation-delay: 0.20s; }
.tile:nth-child(5) { animation-delay: 0.25s; }
.tile:nth-child(6) { animation-delay: 0.30s; }
.tile:nth-child(7) { animation-delay: 0.35s; }
.tile:nth-child(8) { animation-delay: 0.40s; }

/* Basic link styling in content */
a {
    color: var(--accent);
}
</style>
</head>

<body>

<button id="menuButton">☰ Tools</button>
<button id="themeToggle">🌙</button>

<div id="flyout">
    <h2>Tools</h2>
    <a href="/sshd-config-generator">SSHD Config Generator</a>
    <a href="#">More coming soon…</a>
</div>

<header>
    <h1>igaret</h1>
    <p>Developer • Systems tinkerer • Automation enthusiast</p>
</header>

<div id="tabs"></div>

<div id="content">
    <h2>Welcome</h2>
    <p>Select a repository from the tabs above to see its languages and details.</p>
</div>

<script>
// Flyout menu
document.getElementById("menuButton").onclick = () => {
    document.getElementById("flyout").classList.toggle("open");
};

// Theme toggle
const toggle = document.getElementById("themeToggle");
(function initTheme() {
    const saved = localStorage.getItem("theme");
    const initial = saved || "light";
    document.documentElement.setAttribute("data-theme", initial);
    toggle.textContent = initial === "dark" ? "☀️" : "🌙";
})();

toggle.onclick = () => {
    const current = document.documentElement.getAttribute("data-theme") || "light";
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    toggle.textContent = next === "dark" ? "☀️" : "🌙";
    localStorage.setItem("theme", next);
};

// Fetch repos + languages
async function loadRepos() {
    const res = await fetch("https://api.github.com/users/igaret/repos");
    const repos = await res.json();

    const tabsDiv = document.getElementById("tabs");
    const contentDiv = document.getElementById("content");

    if (!Array.isArray(repos)) {
        contentDiv.innerHTML = "<h2>Error</h2><p>Could not load repositories.</p>";
        contentDiv.classList.add("visible");
        return;
    }

    repos.sort((a, b) => a.name.localeCompare(b.name));

    repos.forEach((repo, index) => {
        const tab = document.createElement("div");
        tab.className = "tab";

        const iconUrl = `https://github.com/igaret/${repo.name}/raw/master/.github/icon.png`;
        const fallbackIcon = repo.owner && repo.owner.avatar_url ? repo.owner.avatar_url : "https://github.com/igaret.png";

        const img = document.createElement("img");
        img.src = iconUrl;
        img.onerror = () => { img.src = fallbackIcon; };
        img.className = "repo-icon";

        tab.appendChild(img);
        tab.appendChild(document.createTextNode(repo.name));

        tab.onclick = async () => {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");

            const langRes = await fetch(repo.languages_url);
            const langs = await langRes.json();

            contentDiv.classList.remove("visible");

            const languages = Object.keys(langs);
            const languagesHtml = languages.length
                ? languages.map(l => `<div class="tile">${l}</div>`).join("")
                : `<p>No languages
